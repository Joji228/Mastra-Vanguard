<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra Vanguard (GPT 5.6 SOL (xHIGH)) — Neon City Defender</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071226; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
    #controls {
      position: fixed; left: 16px; bottom: 14px; z-index: 2; pointer-events: none;
      padding: 10px 13px; border: 1px solid rgba(112,229,255,.28); border-radius: 10px;
      color: #d8f9ff; background: rgba(4,12,29,.74); backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.28); font-size: 12px; line-height: 1.5; letter-spacing: .025em;
    }
    #controls b { color: #74ecff; font-weight: 800; }
    #actions { position: fixed; right: 15px; top: 14px; z-index: 3; display: flex; gap: 8px; }
    button {
      appearance: none; border: 1px solid rgba(122,235,255,.35); border-radius: 8px; padding: 8px 11px;
      color: #e7fcff; background: rgba(5,18,40,.74); font: 700 12px/1 system-ui, sans-serif; letter-spacing: .05em;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(17,55,86,.9); border-color: #7fefff; }
    @media (max-width: 760px), (max-height: 600px) {
      #controls { font-size: 10px; padding: 7px 9px; max-width: 72vw; }
      button { padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Astra Vanguard superhero action platformer"></canvas>
  <div id="controls">
    <b>A / D</b> RUN &nbsp; <b>W</b> JUMP / ASCEND &nbsp; <b>S</b> DESCEND<br>
    <b>F</b> TOGGLE FLIGHT &nbsp; <b>SHIFT</b> SUPER SPEED &nbsp; <b>CLICK / SPACE</b> PRISM BEAM &nbsp; <b>ESC</b> PAUSE &nbsp; <b>R</b> RESTART
  </div>
  <div id="actions">
    <button id="mute" aria-label="Toggle sound">SOUND: ON</button>
    <button id="fullscreen" aria-label="Toggle fullscreen">FULLSCREEN</button>
  </div>

  <script>
  'use strict';

  // ---------- Configuration ----------
  const CFG = Object.freeze({
    worldW: 5200, worldH: 1800,
    gravity: 1900, runAccel: 2600, runFriction: 3000, runMax: 370, jumpSpeed: 720,
    flyAccel: 1900, flyDrag: 2.7, flyMax: 720, flightDrain: 9.5, energyRegen: 21.25, killEnergyRestore: .10,
    speedRunMax: 760, speedFlyMax: 1080, speedAccel: 5200, speedDrain: 30, speedRegen: 21,
    playerW: 38, playerH: 66, laserCooldown: .145, laserRange: 1250,
    maxHp: 100, maxEnergy: 135
  });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const approach = (v, target, amount) => v < target ? Math.min(v + amount, target) : Math.max(v - amount, target);
  const rand = (a, b) => a + Math.random() * (b - a);
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

  const SPRITES = Object.freeze({
    astra: loadSprite('assets/sprites/astra-vanguard.png'),
    astraFrames: loadSprite('assets/sprites/astra-frames-v2.png'),
    astraIdle: loadSprite('assets/sprites/astra-idle-frames-v2.png'),
    astraFlight: loadSprite('assets/sprites/astra-flight-frames-v2.png'),
    astraBeam: loadSprite('assets/sprites/astra-beam-v2.png'),
    astraAim: loadSprite('assets/sprites/astra-aim-frames-v2.png'),
    trooper: loadSprite('assets/sprites/shock-trooper.png'),
    trooperFrames: loadSprite('assets/sprites/shock-trooper-frames-v2.png'),
    drone: loadSprite('assets/sprites/prism-drone.png'),
    cityMap: loadSprite('assets/backgrounds/meridian-city-v1.png'),
    buildingFacades: loadSprite('assets/backgrounds/building-facades-v1.png')
  });
  const WALK_FRAMES=Object.freeze([1,0,2,0]);
  const SPRINT_FRAMES=Object.freeze([1,2]);
  const TROOPER_SPRINT_FRAMES=Object.freeze([3,1,3,2]);
  const IDLE_FRAMES=Object.freeze([0,1,0,2,3,2,1,0]);
  const ASTRA_FRAME_Y=Object.freeze([0,0,2,0]);
  const ASTRA_IDLE_FRAME_Y=Object.freeze([0,0,4,4]);
  const ASTRA_FLIGHT_FRAME_Y=Object.freeze([0,0,20,20]);
  const TROOPER_FRAME_X=Object.freeze([0,7,1,10]);
  const TROOPER_FRAME_Y=Object.freeze([0,2,2,1]);
  const ASTRA_AIM_HAND=Object.freeze([{x:50,y:-95},{x:42,y:-84},{x:51,y:-75},{x:35,y:-64}]);
  const ASTRA_BEAM_HAND=Object.freeze({x:57,y:-84});
  const aimFrameForAngle=angle=>angle<-.48?0:angle<-.12?1:angle>.48?3:angle>.12?2:-1;

  function loadSprite(src) {
    const image = new Image();
    image.decoding = 'async';
    image.src = src;
    return image;
  }

  function drawSprite(ctx, image, x, baseline, height, facing=1, rotation=0, flash=false, stretch=1, squash=1, alpha=1) {
    if (!image.complete || !image.naturalWidth) return false;
    const source=image.sheet||image,width=height*source.width/source.height;
    ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x,baseline); ctx.rotate(rotation); ctx.scale(facing*stretch,squash);
    ctx.filter = flash ? 'brightness(4) saturate(0)' : 'none';
    ctx.drawImage(source,-width/2,-height,width,height);
    ctx.restore(); return true;
  }

  function drawSpriteFrame(ctx,image,frame,columns,rows,x,baseline,height,facing=1,rotation=0,flash=false,stretch=1,squash=1,alpha=1){
    if(!image.complete||!image.naturalWidth)return false;
    const source=image.sheet||image,cellW=source.width/columns,cellH=source.height/rows,col=frame%columns,row=Math.floor(frame/columns),width=height*cellW/cellH;
    ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,baseline);ctx.rotate(rotation);ctx.scale(facing*stretch,squash);ctx.filter=flash?'brightness(4) saturate(0)':'none';
    ctx.drawImage(source,col*cellW,row*cellH,cellW,cellH,-width/2,-height,width,height);ctx.restore();return true;
  }

  function roundedRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function rayRect(ox, oy, dx, dy, r, maxDist) {
    let lo = 0, hi = maxDist;
    if (Math.abs(dx) < 1e-8) { if (ox < r.x || ox > r.x + r.w) return null; }
    else { let a = (r.x - ox) / dx, b = (r.x + r.w - ox) / dx; if (a > b) [a,b] = [b,a]; lo = Math.max(lo,a); hi = Math.min(hi,b); }
    if (Math.abs(dy) < 1e-8) { if (oy < r.y || oy > r.y + r.h) return null; }
    else { let a = (r.y - oy) / dy, b = (r.y + r.h - oy) / dy; if (a > b) [a,b] = [b,a]; lo = Math.max(lo,a); hi = Math.min(hi,b); }
    return hi >= lo && hi >= 0 && lo <= maxDist ? Math.max(0, lo) : null;
  }

  // ---------- Input & audio ----------
  class Input {
    constructor(canvas) {
      this.keys = new Set(); this.pressed = new Set(); this.mouse = { x: 0, y: 0, down: false, pressed: false };
      addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (e.shiftKey) { if (!this.keys.has('shift')) this.pressed.add('shift'); this.keys.add('shift'); }
        if (!this.keys.has(k)) this.pressed.add(k);
        this.keys.add(k);
        if (['w','a','s','d','f','r',' ','shift','escape','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
      });
      addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
      addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; this.mouse.pressed = false; });
      const setMouse = e => { const r = canvas.getBoundingClientRect(); this.mouse.x = e.clientX - r.left; this.mouse.y = e.clientY - r.top; };
      canvas.addEventListener('mousemove', setMouse);
      canvas.addEventListener('mousedown', e => { if (e.button === 0) { setMouse(e); this.mouse.down = true; this.mouse.pressed = true; e.preventDefault(); } });
      addEventListener('mouseup', e => { if (e.button === 0) this.mouse.down = false; });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
    }
    down(k) { return this.keys.has(k); }
    hit(k) { return this.pressed.has(k); }
    endFrame() { this.pressed.clear(); this.mouse.pressed = false; }
  }

  class AudioFX {
    constructor() { this.ctx = null; this.muted = false; }
    unlock() {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, dur, type='sine', vol=.05, slide=0) {
      if (this.muted) return; this.unlock();
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur);
    }
    laser() { this.tone(520, .09, 'sawtooth', .035, -230); }
    jump() { this.tone(170, .13, 'square', .035, 180); }
    flight(on) { this.tone(on ? 120 : 240, .22, 'sawtooth', .045, on ? 330 : -120); }
    hit() { this.tone(105, .12, 'square', .045, -45); }
    death() { this.tone(190, .32, 'sawtooth', .06, -150); }
    hurt() { this.tone(85, .28, 'square', .07, -40); }
    pickup() { this.tone(480, .18, 'sine', .05, 430); }
    victory() { [0, .13, .27].forEach((d,i) => setTimeout(() => this.tone([392,523,659][i], .38, 'triangle', .055, 50), d*1000)); }
  }

  // ---------- World objects ----------
  class Platform {
    constructor(x,y,w,h,style='building') {
      const facade = Math.abs(Math.floor(x/53)+Math.floor(y/47)+Math.floor(w/71)+Math.floor(h/89))%4;
      Object.assign(this,{x,y,w,h,style,facade});
    }
    draw(ctx) {
      const roof = this.style === 'float';
      const grad = ctx.createLinearGradient(this.x, this.y, this.x + this.w, this.y + this.h);
      grad.addColorStop(0, roof ? '#223a61' : '#172a4b'); grad.addColorStop(1, roof ? '#111c3a' : '#0a142b');
      ctx.fillStyle = grad; ctx.fillRect(this.x,this.y,this.w,this.h);
      const art=SPRITES.buildingFacades,artReady=!roof&&art.complete&&art.naturalWidth;
      if(artReady){
        const cellW=art.naturalWidth/2,cellH=art.naturalHeight/2,sx=(this.facade%2)*cellW,sy=Math.floor(this.facade/2)*cellH,tile=320;
        ctx.save();ctx.beginPath();ctx.rect(this.x,this.y,this.w,this.h);ctx.clip();ctx.globalAlpha=.7;ctx.filter='saturate(.92) brightness(.72)';
        for(let y=this.y;y<this.y+this.h;y+=tile)for(let x=this.x;x<this.x+this.w;x+=tile){
          const dw=Math.min(tile,this.x+this.w-x),dh=Math.min(tile,this.y+this.h-y);
          ctx.drawImage(art,sx,sy,cellW*(dw/tile),cellH*(dh/tile),x,y,dw,dh);
        }
        const shade=ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.h);shade.addColorStop(0,'rgba(3,10,28,.03)');shade.addColorStop(1,'rgba(2,7,22,.44)');ctx.fillStyle=shade;ctx.fillRect(this.x,this.y,this.w,this.h);ctx.restore();
      }
      ctx.fillStyle = roof ? '#62d8ea' : '#38a7c7'; ctx.fillRect(this.x,this.y,this.w,6);
      ctx.fillStyle = 'rgba(147,235,255,.17)'; ctx.fillRect(this.x,this.y+7,this.w,5);
      if (!roof && this.h > 90 && !artReady) {
        const cols = Math.max(1, Math.floor((this.w-24)/54)), rows = Math.min(8, Math.floor((this.h-34)/64));
        for (let j=0;j<rows;j++) for (let i=0;i<cols;i++) {
          const lit = ((i*7+j*3+Math.floor(this.x))%5) !== 0;
          ctx.fillStyle = lit ? 'rgba(255,204,91,.38)' : 'rgba(38,104,144,.22)';
          ctx.fillRect(this.x+17+i*54,this.y+28+j*64,24,31);
        }
      }
    }
  }

  class Particle {
    constructor(x,y,vx,vy,life,color,size=4,gravity=0) { Object.assign(this,{x,y,vx,vy,life,maxLife:life,color,size,gravity}); }
    update(dt) { this.life-=dt; this.vy+=this.gravity*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=Math.pow(.25,dt); }
    draw(ctx) { const a=clamp(this.life/this.maxLife,0,1); ctx.globalAlpha=a; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size*(.4+.6*a),0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
  }

  class Pickup {
    constructor(x,y,type) { Object.assign(this,{x,y,type,w:28,h:28,t:Math.random()*6,dead:false}); }
    update(dt,game) {
      this.t+=dt;
      if (overlap(this,game.player)) {
        if (this.type==='energy') game.player.energy=Math.min(CFG.maxEnergy,game.player.energy+36);
        else game.player.hp=Math.min(CFG.maxHp,game.player.hp+30);
        this.dead=true; game.audio.pickup(); game.burst(this.x+14,this.y+14,this.type==='energy'?'#68f6ff':'#67ff99',16,180);
      }
    }
    draw(ctx) {
      const bob=Math.sin(this.t*3)*5; ctx.save(); ctx.translate(this.x+14,this.y+14+bob); ctx.rotate(this.t*.8);
      ctx.shadowBlur=18; ctx.shadowColor=this.type==='energy'?'#52eaff':'#65ff9d'; ctx.fillStyle=this.type==='energy'?'#78f3ff':'#85ffad';
      ctx.beginPath(); for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?8:14; const px=Math.cos(a)*r,py=Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath();ctx.fill();
      ctx.fillStyle='#071226'; ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.rotate(-this.t*.8);ctx.fillText(this.type==='energy'?'⚡':'+',0,0);ctx.restore();
    }
  }

  class Crate {
    constructor(x,y,kind='crate') { Object.assign(this,{x,y,w:42,h:42,kind,hp:kind==='barrel'?68:45,dead:false,flash:0}); }
    hit(dmg,game) {
      this.hp-=dmg; this.flash=.08; game.burst(this.x+21,this.y+20,this.kind==='barrel'?'#ff9c36':'#eab772',7,140);
      if(this.hp<=0){ this.dead=true; game.score+=25; game.burst(this.x+21,this.y+21,this.kind==='barrel'?'#ff6c38':'#d49a5b',this.kind==='barrel'?34:16,this.kind==='barrel'?360:220); game.shake+=this.kind==='barrel'?6:2;
        if(this.kind==='barrel') for(const e of game.enemies) if(!e.dead && dist2(e.x,e.y,this.x,this.y)<180**2) e.hit(70,game);
      }
    }
    update(dt){this.flash=Math.max(0,this.flash-dt);}
    draw(ctx){ctx.save();ctx.translate(this.x,this.y);ctx.shadowBlur=this.kind==='barrel'?10:0;ctx.shadowColor='#ff9b42';ctx.fillStyle=this.flash?'#fff':this.kind==='barrel'?'#cf4f31':'#8a5838';roundedRect(ctx,0,0,this.w,this.h,5);ctx.fill();ctx.strokeStyle=this.kind==='barrel'?'#ffbc54':'#d99b5f';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(37,37);ctx.moveTo(37,5);ctx.lineTo(5,37);ctx.stroke();ctx.restore();}
  }

  class HostileProjectile {
    constructor(x,y,vx,vy){Object.assign(this,{x,y,px:x,py:y,vx,vy,r:6,life:4,dead:false,spin:rand(0,Math.PI*2)});}
    update(dt,g){this.life-=dt;this.px=this.x;this.py=this.y;this.x+=this.vx*dt;this.y+=this.vy*dt;this.spin+=dt*12;if(this.life<=0)this.dead=true;const b={x:this.x-6,y:this.y-6,w:12,h:12};if(!this.dead&&overlap(b,g.player)){g.player.damage(10,this.vx*.38,-210,g);this.dead=true;g.burst(this.x,this.y,'#ff62ce',8,130);}for(const p of g.platforms)if(!this.dead&&overlap(b,p)){this.dead=true;g.burst(this.x,this.y,'#ff62ce',5,90);}}
    draw(ctx){ctx.save();ctx.lineCap='round';ctx.shadowBlur=17;ctx.shadowColor='#ff42cb';ctx.strokeStyle='rgba(255,73,211,.45)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(this.x-this.vx*.07,this.y-this.vy*.07);ctx.lineTo(this.x,this.y);ctx.stroke();ctx.translate(this.x,this.y);ctx.rotate(this.spin);ctx.fillStyle='#fff0ff';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(0,5);ctx.lineTo(-9,0);ctx.lineTo(0,-5);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff4bd1';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
  }

  // ---------- Characters ----------
  class Player {
    constructor(x,y){this.spawnX=x;this.spawnY=y;this.reset();}
    reset(){Object.assign(this,{x:this.spawnX,y:this.spawnY,w:CFG.playerW,h:CFG.playerH,vx:0,vy:0,onGround:false,flying:false,energy:CFG.maxEnergy,speedEnergy:100,boosting:false,hp:CFG.maxHp,dead:false,invuln:0,fireCd:0,facing:1,aimAngle:0,anim:0,walkCycle:0,flightCapePhase:0,flightCapeRate:0,shootAnim:0,hurtAnim:0,deathAt:0,landed:false,flightTrail:0,speedTrail:0,sprintDust:0});}
    restoreKillEnergy(g){
      const before=this.energy;this.energy=Math.min(CFG.maxEnergy,this.energy+CFG.maxEnergy*CFG.killEnergyRestore);
      if(this.energy>before){g.burst(this.x+this.w/2,this.y+this.h*.42,'#63f5ff',9,125);g.audio.tone(440,.16,'sine',.025,260);}
    }
    beamOrigin(){
      const speed=Math.abs(this.vx),run=clamp(speed/CFG.runMax,0,1),step=Math.sin(this.walkCycle),sprinting=this.boosting&&this.onGround&&run>.35,flightSpeed=clamp(Math.hypot(this.vx,this.vy)/(this.boosting?CFG.speedFlyMax:CFG.flyMax),0,1);
      const bob=this.flying?Math.sin(this.anim*5.5)*(.55+flightSpeed*.55):Math.abs(step)*(sprinting?3.1:1.8)*run,tilt=this.flying?clamp(this.vx/CFG.flyMax,-.18,.18):step*.025*run+Math.sin(this.walkCycle*.5)*.012*run+(sprinting?this.facing*.13:0);
      const squash=this.flying?.97:1+Math.abs(step)*.018*run-(sprinting?.025:0),stretch=this.flying?1+flightSpeed*.08:1-Math.abs(step)*.02*run+(sprinting?.065:0),frame=aimFrameForAngle(this.aimAngle),hand=frame>=0?ASTRA_AIM_HAND[frame]:ASTRA_BEAM_HAND;
      const shootT=this.shootAnim/.22,kick=this.shootAnim>0?Math.sin((1-shootT)*Math.PI)*3.2:0,baseX=this.x+this.w/2-this.facing*kick,baseY=this.y+this.h+8+bob;
      const lx=this.facing*hand.x*stretch,ly=hand.y*squash,cs=Math.cos(tilt),sn=Math.sin(tilt);
      return{x:baseX+lx*cs-ly*sn,y:baseY+lx*sn+ly*cs};
    }
    toggleFlight(g){if(this.flying){this.flying=false;g.audio.flight(false);}else if(this.energy>=15&&!this.dead){this.flying=true;this.onGround=false;this.vy=Math.min(this.vy,-70);g.audio.flight(true);g.burst(this.x+this.w/2,this.y+this.h,'#70efff',12,180);}}
    update(dt,g){
      if(this.dead)return;this.anim+=dt;this.invuln=Math.max(0,this.invuln-dt);this.fireCd=Math.max(0,this.fireCd-dt);this.shootAnim=Math.max(0,this.shootAnim-dt);this.hurtAnim=Math.max(0,this.hurtAnim-dt);
      if(g.input.hit('f'))this.toggleFlight(g);
      const left=g.input.down('a')||g.input.down('arrowleft')||g.input.hit('a')||g.input.hit('arrowleft'),right=g.input.down('d')||g.input.down('arrowright')||g.input.hit('d')||g.input.hit('arrowright');
      const up=g.input.down('w')||g.input.down('arrowup'),down=g.input.down('s')||g.input.down('arrowdown');
      const moveX=(right?1:0)-(left?1:0),moveY=(down?1:0)-(up?1:0),wasBoosting=this.boosting;
      this.boosting=(g.input.down('shift')||g.input.hit('shift'))&&this.speedEnergy>0&&(moveX!==0||(this.flying&&moveY!==0));
      if(this.boosting){this.speedEnergy=Math.max(0,this.speedEnergy-CFG.speedDrain*dt);if(!wasBoosting)g.audio.tone(150,.24,'sawtooth',.045,520);}
      else this.speedEnergy=Math.min(100,this.speedEnergy+CFG.speedRegen*dt);
      if(this.speedEnergy<=0)this.boosting=false;
      if(left!==right)this.facing=right?1:-1;
      const wasGround=this.onGround;
      if(this.flying){
        let ix=moveX,iy=moveY;if(ix&&iy){ix*=.707;iy*=.707;}
        const accel=this.boosting?CFG.speedAccel:CFG.flyAccel,maxSpeed=this.boosting?CFG.speedFlyMax:CFG.flyMax;
        this.vx+=ix*accel*dt;this.vy+=iy*accel*dt;

      if(this.hp<this.maxHp){ctx.fillStyle='#160a18';ctx.fillRect(this.x,this.y-12,this.w,5);ctx.fillStyle='#c65cff';ctx.fillRect(this.x+1,this.y-11,(this.w-2)*this.hp/this.maxHp,3);}
    }
  }

  class Camera {
    constructor(){this.x=0;this.y=0;}
    update(dt,p,w,h){const lookX=p.vx*.18,lookY=p.flying?p.vy*.14:-55;const tx=clamp(p.x+p.w/2-w/2+lookX,0,Math.max(0,CFG.worldW-w));const ty=clamp(p.y+p.h/2-h*.54+lookY,0,Math.max(0,CFG.worldH-h));const t=1-Math.exp(-5.5*dt);this.x=lerp(this.x,tx,t);this.y=lerp(this.y,ty,t);}
  }

  // ---------- Game ----------
  class Game {
    constructor(canvas){
      this.canvas=canvas;this.ctx=canvas.getContext('2d');this.input=new Input(canvas);this.audio=new AudioFX();this.camera=new Camera();this.w=innerWidth;this.h=innerHeight;this.last=performance.now();this.paused=false;this.intro=5;this.shake=0;this.muted=false;
      this.stars=Array.from({length:85},()=>({x:Math.random(),y:Math.random()*.72,s:rand(.5,2),a:rand(.15,.65)}));
      this.skyline=Array.from({length:42},(_,i)=>({x:i*150+rand(-20,20),w:rand(70,145),h:rand(120,410),seed:i}));
      this.resize();this.reset();addEventListener('resize',()=>this.resize());
      document.addEventListener('visibilitychange',()=>{if(document.hidden)this.paused=true;});
    }
    resize(){this.w=innerWidth;this.h=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);this.canvas.width=Math.floor(this.w*dpr);this.canvas.height=Math.floor(this.h*dpr);this.canvas.style.width=this.w+'px';this.canvas.style.height=this.h+'px';this.ctx.setTransform(dpr,0,0,dpr,0,0);this.dpr=dpr;}
    reset(){
      this.platforms=[
        new Platform(0,1320,1250,480),new Platform(1350,1400,600,400),new Platform(2050,1500,500,300),new Platform(2700,1360,920,440),new Platform(3740,1450,1460,350),
        new Platform(380,1120,440,200),new Platform(900,980,300,340),new Platform(1580,1180,370,220),new Platform(2800,1080,500,280),new Platform(3350,800,300,560),new Platform(4140,1150,520,300),new Platform(4700,920,360,530),
        new Platform(1235,850,240,25,'float'),new Platform(1740,930,210,24,'float'),new Platform(2020,700,260,26,'float'),new Platform(2440,960,220,25,'float'),new Platform(2820,600,250,25,'float'),new Platform(3150,440,180,24,'float'),new Platform(3740,620,260,25,'float'),new Platform(4110,760,240,25,'float'),new Platform(4460,570,220,25,'float')
      ];
      this.player=new Player(135,1248);this.enemies=[
        new GroundEnemy(260,1268),new GroundEnemy(560,1068),new GroundEnemy(1010,928),new GroundEnemy(1660,1128),new GroundEnemy(2910,1028),new GroundEnemy(3440,748),new GroundEnemy(4270,1098),new GroundEnemy(4850,868),
        new FlyingEnemy(1450,690),new FlyingEnemy(2280,820),new FlyingEnemy(3000,350),new FlyingEnemy(3900,490),new FlyingEnemy(4530,680)
      ];
      this.crates=[new Crate(720,1078),new Crate(1830,1138,'barrel'),new Crate(2870,1038),new Crate(4550,1108,'barrel'),new Crate(4950,878)];
      this.pickups=[new Pickup(1285,805,'energy'),new Pickup(3205,395,'health'),new Pickup(4515,525,'energy')];
      this.particles=[];this.beams=[];this.projectiles=[];this.score=0;this.victory=false;this.victoryPlayed=false;this.intro=5;this.paused=false;this.camera.x=0;this.camera.y=700;this.shake=0;
      try{this.highScore=Number(localStorage.getItem('astraVanguardHigh')||0);}catch(e){this.highScore=0;}
    }
    moveSolid(e,dt){
      const steps=Math.max(1,Math.ceil(Math.max(Math.abs(e.vx*dt),Math.abs(e.vy*dt))/8)),sx=e.vx*dt/steps,sy=e.vy*dt/steps;
      for(let i=0;i<steps;i++){
        e.x+=sx;
        for(const p of this.platforms)if(overlap(e,p)){if(sx>0)e.x=p.x-e.w;else if(sx<0)e.x=p.x+p.w;e.vx=0;}
        e.x=clamp(e.x,0,CFG.worldW-e.w);
        e.y+=sy;
        for(const p of this.platforms)if(overlap(e,p)){if(sy>0){e.y=p.y-e.h;e.onGround=true;}else if(sy<0)e.y=p.y+p.h;e.vy=0;}
      }
    }
    burst(x,y,color,count=10,speed=180){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(speed*.25,speed);this.particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(.2,.65),color,rand(2,6),rand(0,340)));}}
    dust(x,y,count){for(let i=0;i<count;i++)this.particles.push(new Particle(x+rand(-14,14),y-2,rand(-95,95),rand(-130,-25),rand(.25,.5),'#9ac5d0',rand(3,7),280));}
    update(dt){
      if(this.input.hit('escape'))this.paused=!this.paused;
      if(this.input.hit('r')&&(this.player.dead||this.victory))this.reset();
      if(this.paused||this.player.dead||this.victory){this.input.endFrame();return;}
      this.intro=Math.max(0,this.intro-dt);this.player.update(dt,this);
      for(const e of this.enemies)e.update(dt,this);for(const c of this.crates)c.update(dt);for(const p of this.pickups)p.update(dt,this);for(const q of this.projectiles)q.update(dt,this);for(const p of this.particles)p.update(dt);
      for(const b of this.beams)b.life-=dt;
      this.enemies=this.enemies.filter(e=>!e.dead);this.crates=this.crates.filter(c=>!c.dead);this.pickups=this.pickups.filter(p=>!p.dead);this.projectiles=this.projectiles.filter(p=>!p.dead);this.particles=this.particles.filter(p=>p.life>0);this.beams=this.beams.filter(b=>b.life>0);
      if(!this.enemies.length){this.victory=true;if(!this.victoryPlayed){this.victoryPlayed=true;this.audio.victory();this.score+=1000;}}
      if(this.score>this.highScore){this.highScore=this.score;try{localStorage.setItem('astraVanguardHigh',String(this.highScore));}catch(e){}}
      this.camera.update(dt,this.player,this.w,this.h);this.shake=Math.max(0,this.shake-18*dt);this.input.endFrame();
    }
    drawBackground(){
      const c=this.ctx,g=c.createLinearGradient(0,0,0,this.h);g.addColorStop(0,'#07162e');g.addColorStop(.54,'#17476c');g.addColorStop(1,'#d45f67');c.fillStyle=g;c.fillRect(0,0,this.w,this.h);
      const mapReady=SPRITES.cityMap.complete&&SPRITES.cityMap.naturalWidth;if(mapReady){const img=SPRITES.cityMap,scale=Math.max(this.h/img.naturalHeight,(this.w+700)/img.naturalWidth),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale,dx=(this.w-dw)/2-this.camera.x*.045,dy=this.h-dh+this.camera.y*.018;c.save();c.globalAlpha=.78;c.filter='saturate(1.06) brightness(.82)';c.drawImage(img,dx,dy,dw,dh);c.restore();}else{const sunX=this.w*.76-this.camera.x*.025,sunY=160-this.camera.y*.025;c.save();c.globalAlpha=.65;c.shadowBlur=70;c.shadowColor='#ffbd86';c.fillStyle='#ffd08f';c.beginPath();c.arc(sunX,sunY,54,0,Math.PI*2);c.fill();c.restore();}
      c.fillStyle='rgba(220,247,255,.7)';for(const s of this.stars){const x=(s.x*this.w-this.camera.x*.018+this.w)%this.w;c.globalAlpha=s.a*(mapReady?.22:1);c.fillRect(x,s.y*this.h-this.camera.y*.018,s.s,s.s);}c.globalAlpha=1;
      // Far parallax city.
      c.save();c.globalAlpha=mapReady?.48:1;c.translate(-this.camera.x*.16,this.h+this.camera.y*.08);for(const b of this.skyline){const base=-35,h=b.h;c.fillStyle=b.seed%3===0?'#132a4a':'#10233f';c.fillRect(b.x,base-h,b.w,h);c.fillStyle='rgba(100,190,221,.16)';for(let yy=base-h+18;yy<base-12;yy+=32)for(let xx=b.x+13;xx<b.x+b.w-10;xx+=28)if((xx+yy+b.seed)%4)c.fillRect(xx,yy,8,13);}c.restore();
      const haze=c.createLinearGradient(0,this.h*.6,0,this.h);haze.addColorStop(0,'rgba(16,47,78,0)');haze.addColorStop(1,'rgba(4,12,29,.6)');c.fillStyle=haze;c.fillRect(0,0,this.w,this.h);
    }
    drawWorld(){
      const c=this.ctx,sx=this.shake?rand(-this.shake,this.shake):0,sy=this.shake?rand(-this.shake,this.shake):0;c.save();c.translate(-this.camera.x+sx,-this.camera.y+sy);
      // Danger glow beneath the city gaps.
      const hazard=c.createLinearGradient(0,1550,0,1800);hazard.addColorStop(0,'rgba(255,72,86,.08)');hazard.addColorStop(1,'rgba(255,35,93,.55)');c.fillStyle=hazard;c.fillRect(0,1550,CFG.worldW,250);
      c.fillStyle='rgba(255,79,111,.55)';for(let x=0;x<CFG.worldW;x+=64){c.beginPath();c.moveTo(x,1770);c.lineTo(x+32,1740+Math.sin(x)*14);c.lineTo(x+64,1770);c.fill();}
      for(const p of this.platforms)p.draw(c);for(const p of this.pickups)p.draw(c);for(const q of this.crates)q.draw(c);for(const e of this.enemies)e.draw(c);for(const p of this.projectiles)p.draw(c);this.player.draw(c,this);
      for(const b of this.beams){const a=clamp(b.life/b.max,0,1),pulse=.82+.18*Math.sin((1-a)*30+b.seed);c.save();c.globalAlpha=a;c.lineCap='round';c.shadowBlur=24;c.shadowColor='#ffea4c';c.strokeStyle='#ff4f57';c.lineWidth=11*a*pulse;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.ex,b.ey);c.stroke();c.strokeStyle='#fffbd0';c.lineWidth=3.2*a*pulse;c.stroke();c.restore();}
      for(const p of this.particles)p.draw(c);
      // Speed streaks in world space.
      if(this.player.boosting||(this.player.flying&&Math.hypot(this.player.vx,this.player.vy)>470)){c.save();c.globalAlpha=this.player.boosting?.42:.22;c.strokeStyle=this.player.boosting?'#ffe77a':'#b9f8ff';c.lineWidth=this.player.boosting?3:2;const count=this.player.boosting?18:10;for(let i=0;i<count;i++){const x=this.player.x+rand(-280,280),y=this.player.y+rand(-180,180);c.beginPath();c.moveTo(x,y);c.lineTo(x-this.player.vx*(this.player.boosting?.13:.08),y-this.player.vy*(this.player.boosting?.13:.08));c.stroke();}c.restore();}
      c.restore();
    }
    bar(x,y,w,h,value,color,label,urgent=false){const c=this.ctx;c.fillStyle='rgba(4,12,29,.78)';roundedRect(c,x,y,w,h,7);c.fill();c.strokeStyle='rgba(145,232,255,.25)';c.stroke();const pad=3,fill=(w-pad*2)*clamp(value,0,1);if(fill>0){const gr=c.createLinearGradient(x,y,x+w,y);gr.addColorStop(0,color);gr.addColorStop(1,'#d9ffff');c.fillStyle=urgent&&Math.floor(performance.now()/180)%2?'#ff345f':gr;roundedRect(c,x+pad,y+pad,fill,h-pad*2,4);c.fill();}c.fillStyle='#eafcff';c.font='800 11px system-ui';c.textAlign='left';c.fillText(label,x,y-6);}
    drawHUD(){
      const c=this.ctx;c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=8;this.bar(22,39,230,18,this.player.hp/CFG.maxHp,'#ff4668',`HEALTH  ${Math.ceil(this.player.hp)}`);this.bar(22,82,230,18,this.player.energy/CFG.maxEnergy,'#29d9f2',`FLIGHT ENERGY  ${Math.ceil(this.player.energy)}`,this.player.energy<CFG.maxEnergy*.22);this.bar(22,125,230,18,this.player.speedEnergy/100,'#ffd84f',`SUPER SPEED  ${Math.ceil(this.player.speedEnergy)}`,this.player.speedEnergy<18);
      c.textAlign='left';c.fillStyle='#fff';c.font='900 17px system-ui';c.fillText(`SCORE  ${String(this.score).padStart(6,'0')}`,22,174);c.fillStyle='rgba(220,250,255,.65)';c.font='700 11px system-ui';c.fillText(`BEST  ${String(this.highScore).padStart(6,'0')}`,22,192);
      const state=this.player.flying?'ON':'OFF',speedState=this.player.boosting?'ON':this.player.speedEnergy<99?'RECHARGING':'READY';c.fillStyle=this.player.flying?'#6ef5ff':'rgba(220,235,245,.62)';c.font='900 14px system-ui';c.fillText(`FLIGHT: ${state}`,22,219);c.fillStyle=this.player.boosting?'#ffe76a':this.player.speedEnergy<18?'#ff7893':'rgba(220,235,245,.62)';c.fillText(`SUPER SPEED: ${speedState}`,22,240);
      c.textAlign='center';c.fillStyle='#fff';c.font='800 14px system-ui';c.fillText('OBJECTIVE: DEFEAT ALL HOSTILES',this.w/2,31);c.fillStyle='#72efff';c.font='900 18px system-ui';c.fillText(`ENEMIES REMAINING: ${this.enemies.length}`,this.w/2,55);
      if(this.intro>0&&!this.player.dead){const a=clamp(this.intro<1?this.intro:1,0,1);c.globalAlpha=a;c.fillStyle='rgba(3,12,28,.7)';roundedRect(c,this.w/2-210,this.h*.68,420,66,12);c.fill();c.fillStyle='#86f4ff';c.font='900 22px system-ui';c.fillText('ASTRA VANGUARD',this.w/2,this.h*.68+27);c.fillStyle='#e9fcff';c.font='600 13px system-ui';c.fillText('Protect Meridian City. Press F to take flight.',this.w/2,this.h*.68+49);c.globalAlpha=1;}
      if(this.paused)this.overlay('PAUSED','Press Esc to resume','#7cefff');
      if(this.player.dead)this.overlay('YOU DIED','Press R to Restart','#ff5575');
      if(this.victory)this.overlay('CITY SECURED','Press R to play again','#70f6d1');c.restore();
    }
    overlay(title,sub,color){const c=this.ctx;c.fillStyle='rgba(2,7,18,.68)';c.fillRect(0,0,this.w,this.h);c.textAlign='center';c.shadowBlur=28;c.shadowColor=color;c.fillStyle=color;c.font=`900 ${Math.min(64,this.w*.09)}px system-ui`;c.fillText(title,this.w/2,this.h/2-14);c.shadowBlur=0;c.fillStyle='#effdff';c.font='700 19px system-ui';c.fillText(sub,this.w/2,this.h/2+31);}
    draw(){this.drawBackground();this.drawWorld();this.drawHUD();}
    loop(now){let dt=Math.min(.033,(now-this.last)/1000||.016);this.last=now;this.update(dt);this.draw();requestAnimationFrame(t=>this.loop(t));}
  }

  const canvas=document.getElementById('game'),game=new Game(canvas);
  document.getElementById('mute').addEventListener('click',e=>{game.audio.muted=!game.audio.muted;e.currentTarget.textContent=`SOUND: ${game.audio.muted?'OFF':'ON'}`;game.audio.unlock();});
  document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
  addEventListener('pointerdown',()=>game.audio.unlock(),{once:true});
  requestAnimationFrame(t=>{game.last=t;game.loop(t);});
  </script>
</body>
